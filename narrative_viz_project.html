<!DOCTYPE html>
<meta charset="utf-8">

<!-- Load d3.js -->
<script src="https://d3js.org/d3.v4.js"></script>

<!-- Add 2 buttons -->
<button onclick="update('var1')">1: The Least Popular Birthdays</button>
<button onclick="update('var2')">2: Trends over Time</button>
<button onclick="update('var3')">3: Sunday the 13th?</button>

<!-- Create a div where the graph will take place -->
<div id="my_dataviz"></div>


<script>

// set the dimensions and margins of the graph
var margin = {top: 100, right: 100, bottom: 100, left: 500},
    width = 700,
    height = 500;

// append the svg object to the body of the page
var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform",
          "translate(" + margin.left + "," + margin.top + ")");


// A function that create / update the plot for a given variable:
function update(selectedVar) {
    svg.selectAll("*").remove();
    svg.append("text")
    .attr("x", width / 2)               
    .attr("y", margin.top)                 
    .attr("text-anchor", "middle")        
    .style("font-size", "20px")        
    .style("font-weight", "bold")          
    .text("Are People Too Superstitious to Have Babies on Friday the 13th?");
    if (selectedVar == "var1"){
        d3.csv("https://raw.githubusercontent.com/ananv21/ananv21.github.io/refs/heads/main/avg_births_by_date_of_month_us.csv", 

        function(data) {
            // sort data
            data.sort(function(b, a) {
                return a.births - b.births;
            });
            // Add X axis --> it is a date format
            var x = d3.scaleBand().range([ 0, width ]).domain(data.map(function(d) { return d.date_of_month; })).padding(0.2);
            var xAxis = svg.append("g").attr("transform", "translate(0," + height + ")").call(d3.axisBottom(x)).selectAll("text")
            .attr("transform", "translate(-10,0)rotate(-45)")
            .style("text-anchor", "end");

            // Add Y axis
            var y = d3.scaleLinear().range([ height, 0 ]).domain([0, d3.max(data, function(d) { return +d.births; })]);
            var yAxis = svg.append("g").transition().duration(1000).call(d3.axisLeft(y));

            // create a tooltip
            var Tooltip = d3.select("#div_template")
                .append("div")
                .style("opacity", 0)
                .attr("class", "tooltip")
                .style("background-color", "white")
                .style("border", "solid")
                .style("border-width", "2px")
                .style("border-radius", "5px")
                .style("padding", "5px")

            // Three function that change the tooltip when user hover / move / leave a cell
            var mouseover = function(d) {
                // var subgroupName = d3.select(this).datum();
                tooltip
                    .html("ABCD")
                    .style("opacity", 1)
            }
            var mousemove = function(d) {
                tooltip
                .style("left", (d3.mouse(this)[0]+90) + "px") // It is important to put the +90: other wise the tooltip is exactly where the point is an it creates a weird effect
                .style("top", (d3.mouse(this)[1]) + "px")
            }
            var mouseleave = function(d) {
                tooltip
                .style("opacity", 0)
            }

            // Bars
            svg.selectAll("mybar")
            .data(data)
            .enter()
            .append("rect")
                .attr("x", function(d) { return x(d.date_of_month); })
                .attr("width", x.bandwidth())
                .attr("fill", "#69b3a2")
                // no bar at the beginning thus:
                .attr("height", function(d) { return height - y(0); }) // always equal to 0
                .attr("y", function(d) { return y(0); })
            .on("mouseover", mouseover)
            .on("mousemove", mousemove)
            .on("mouseleave", mouseleave)

            // Animation
            svg.selectAll("rect")
            .transition()
            .duration(800)
            .attr("y", function(d) { return y(d.births); })
            .attr("height", function(d) { return height - y(d.births); })
            .delay(function(d,i){console.log(i) ; return(i*100)})

        }

    )}
    else{
        d3.csv("https://raw.githubusercontent.com/ananv21/ananv21.github.io/refs/heads/main/avg_births_by_year_us.csv", 

        function(data) {

            if (selectedVar == 'var2'){
                var filter_data = data.filter(function(d){return (d.date_category=="day_13") || (d.date_category=="non_13")});

                var sumstat = d3.nest() // nest function allows to group the calculation per level of a factor
                .key(function(d) { return d.date_category;})
                .entries(filter_data);

                // Add X axis --> it is a date format
                var x = d3.scaleLinear().range([ 0, width ]).domain(d3.extent(filter_data, function(d) { return d.year; }));
                svg.append("g").attr("transform", "translate(0," + height + ")").transition().duration(1000).call(d3.axisBottom(x).tickFormat(d3.format("d")));
            
                // Add Y axis
                var y = d3.scaleLinear().range([ height, 0 ]).domain([0, d3.max(filter_data, function(d) { return +d.births; })]);
                svg.append("g").transition().duration(1000).call(d3.axisLeft(y));

                // color palette
                var res = sumstat.map(function(d){ return d.key }); // list of group names
                var color = d3.scaleOrdinal()
                    .domain(res)
                    .range(['orange','blue']);

            }
            else if (selectedVar == 'var3') {
                svg.selectAll("path").remove();
                var filter_data = data.filter(function(d){return (d.date_category!="day_13")});

                var sumstat = d3.nest() // nest function allows to group the calculation per level of a factor
                .key(function(d) { return d.date_category;})
                .entries(filter_data);

                // Add X axis --> it is a date format
                var x = d3.scaleLinear().range([ 0, width ]).domain(d3.extent(filter_data, function(d) { return d.year; }));
                svg.append("g").attr("transform", "translate(0," + height + ")").transition().duration(1000).call(d3.axisBottom(x).tickFormat(d3.format("d")));
            
                // Add Y axis
                var y = d3.scaleLinear().range([ height, 0 ]).domain([0, d3.max(filter_data, function(d) { return +d.births; })]);
                svg.append("g").transition().duration(1000).call(d3.axisLeft(y));

                // color palette
                var res = sumstat.map(function(d){ return d.key }); // list of group names
                var color = d3.scaleOrdinal().domain(res).range(["gold", "blue", "green", "yellow", "black", "grey", "darkgreen", "pink", "brown"]);

            }
            // Draw the line
            svg.selectAll(".line")
                .data(sumstat)
                .enter()
                .append("path")
                    .attr("d", function(d){
                        return d3.line()
                            .x(function(d) { return x(d.year); })
                            .y(function(d) { return y(+d.births); })
                            (d.values)
                        })
                    .attr("fill", "none")
                    .attr("stroke", function(d){ return color(d.key) })
                    .attr("stroke-width", 1.5)
                
        }
    )}
    }

// Initialize plot
update('var1')

</script>
